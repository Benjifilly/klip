name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint & type-check mobile app
        run: |
          npm run lint --workspace mobile
          npx tsc --noEmit --project mobile

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Unit + E2E tests (helpers, crypto, relay)
        run: npm test

      - name: Type-check & build client
        run: npm run build:client
